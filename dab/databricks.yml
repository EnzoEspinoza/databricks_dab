# This is a Databricks asset bundle definition for dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab
  uuid: 680024bc-73dd-4402-8628-d7083b124cfb

include:
  - resources/*.yml
  - clusters/*.yaml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  dab_notebook:
    description: This is my dab notebook
    default: ../notebooks/hello.ipynb


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-64859678-b530.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-64859678-b530.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/enzoespinoza3008@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/enzoespinoza3008@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: enzoespinoza3008@gmail.com
        level: CAN_MANAGE
