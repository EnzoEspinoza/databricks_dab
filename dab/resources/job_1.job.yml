# A sample job for dab.

resources:
  jobs:
    job_1:
      name: job_1

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: job_1_t1
          notebook_task:
            #notebook_path: ../src/sample_notebook.ipynb
            notebook_path: ${var.dab_notebook}
            base_parameters:
              t1_param: "param-1"
        - task_key: job_2_trigger
          depends_on:
            - task_key: job_1_t1
          run_job_task:
            job_id: ${resources.jobs.job_2.id}
            job_parameters:
              param_from_job_1: "{{tasks.job_1_t1.values.from_t1}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "4"